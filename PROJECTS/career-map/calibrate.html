<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Basemap calibration</title>
<style>
  body { margin: 0; background: #1a1a1a; color: #ddd; font: 13px/1.4 ui-monospace, monospace; }
  .stage { position: relative; width: 1000px; height: 667px; margin: 0 auto; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .layer-water path { fill: #2b7fd4; fill-opacity: .45; stroke: none; }
  .layer-roads path { fill: none; stroke: #ff2d55; stroke-width: 2; }
  .layer-border path { fill: none; stroke: #00ff88; stroke-width: 3; }
  .layer-labels circle { fill: #ffcc00; stroke: #000; stroke-width: 1; }
  .layer-labels text { fill: #ffcc00; font: 11px sans-serif; text-anchor: middle;
    paint-order: stroke; stroke: #000; stroke-width: 3; }
  .bar { width: 1000px; margin: 8px auto; display: flex; gap: 16px; align-items: center; }
</style>
</head>
<body>
<div class="bar">
  <label>reference <input id="op" type="range" min="0" max="100" value="70"></label>
  <span id="read">move the mouse over the map</span>
</div>
<div class="stage">
  <img id="ref" src="../docs/reference/san-joaquin-county-basemap.png" alt="">
</div>
<script src="data/sales.js"></script>
<script src="js/basemap.js"></script>
<script>
  const stage = document.querySelector('.stage');
  const svg = CareerMapBasemap.create();
  stage.appendChild(svg);
  CareerMapBasemap.labelCities(svg, Object.keys(CAREER_MAP_META.cities));

  const ref = document.getElementById('ref');
  document.getElementById('op').addEventListener('input', (e) => {
    ref.style.opacity = e.target.value / 100;
  });
  ref.style.opacity = 0.7;

  // Read map coordinates under the cursor so I can pull vertices off the photo.
  const read = document.getElementById('read');
  stage.addEventListener('mousemove', (e) => {
    const r = stage.getBoundingClientRect();
    read.textContent = `${Math.round(e.clientX - r.left)},${Math.round(e.clientY - r.top)}`;
  });
</script>
</body>
</html>
